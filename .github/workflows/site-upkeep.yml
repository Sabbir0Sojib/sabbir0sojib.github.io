# Runs after every change to the site's content, images, styles or scripts on main
# (for example a save in Pages CMS). It:
#   1. shrinks newly uploaded images (JPG/PNG to WebP, max 2400 px) and fixes their links,
#   2. rebuilds the page shells, sitemap.xml and robots.txt (.impeccable/build-pages.py),
#   3. pre-renders the content into the HTML so search engines see it (.github/scripts/prerender.mjs),
# then commits the result and republishes the site.
name: Site upkeep

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/**"
      - ".impeccable/build-pages.py"
      - ".github/scripts/**"
      - ".github/workflows/site-upkeep.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          pip install --quiet pillow
          npm install --silent --no-save --prefix .github/scripts playwright-core@1.56.1

      - name: Shrink new or changed images
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- assets/img > files.txt
          else
            find assets/img -type f > files.txt
          fi
          cat files.txt
          xargs -d '\n' python .github/scripts/shrink-images.py < files.txt
          rm files.txt

      - name: Rebuild pages, sitemap and robots.txt
        run: python .impeccable/build-pages.py

      - name: Pre-render content into the pages
        run: |
          python -m http.server 4000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          node .github/scripts/prerender.mjs

      - name: Commit the result
        id: commit
        run: |
          git add -A assets/img assets/data content maps *.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Site upkeep: images, pages and pre-rendered content"
          git pull --no-rebase --no-edit origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow do not start a Pages build on their own.
      - name: Republish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick it up on the next change"
