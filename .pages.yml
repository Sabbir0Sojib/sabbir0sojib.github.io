# Pages CMS configuration (https://app.pagescms.org).
# Sign in with GitHub, open this repository, and edit the website with forms.
# Every save is a commit; GitHub Pages republishes the site in about a minute.

media:
  input: assets/img
  output: /assets/img
  extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: site
    label: Page titles and text
    description: Titles and intro lines of each page, the contact note and the footer.
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: home_maps_title, label: "Home: maps section title", type: string }
      - { name: home_research_title, label: "Home: research section title", type: string }
      - { name: home_projects_title, label: "Home: projects section title", type: string }
      - { name: research_title, label: Research page title, type: string }
      - { name: research_intro, label: Research page intro, type: text }
      - { name: projects_title, label: Projects page title, type: string }
      - { name: projects_intro, label: Projects page intro, type: text }
      - { name: maps_title, label: Maps page title, type: string }
      - { name: maps_intro, label: Maps page intro, type: text }
      - { name: gallery_title, label: Gallery page title, type: string }
      - { name: gallery_intro, label: Gallery page intro, type: text }
      - { name: fun_title, label: Fun page title, type: string }
      - { name: fun_intro, label: Fun page intro, type: text }
      - { name: fun_howto_title, label: "Fun page: How to play title", type: string }
      - { name: fun_howto, label: "Fun page: How to play text", type: text }
      - { name: fun_places_title, label: "Fun page: landmarks list title", type: string }
      - { name: contact_title, label: Contact section title, type: string }
      - { name: contact_note, label: Contact section note, type: text }
      - { name: notfound_title, label: "Page not found (404): title", type: string }
      - { name: notfound_text, label: "Page not found (404): text", type: text }
      - { name: footer_tagline, label: Footer line under your name, type: text }
      - { name: footer, label: Footer copyright line, type: string }

  - name: projects
    label: Projects (GitHub)
    description: Code projects with a GitHub repository. Shown newest first by date.
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: year, label: Year, type: string }
      - { name: date, label: "Date (sets the order; newest shows first)", type: date }
      - { name: description, label: Description, type: text }
      - { name: tools, label: "Tools (comma separated, for example: Python, geopandas)", type: string }
      - { name: repo, label: GitHub repository link, type: string, required: true }
      - { name: image, label: Preview image (optional), type: image }
      - { name: image_alt, label: Image description (for screen readers), type: string }

  - name: maps
    label: Maps
    description: Single maps. Maps with an image appear in the grid; maps without an image appear under "More maps". Shown newest first by date.
    type: file
    path: content/maps.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: year, label: Year, type: string }
      - { name: date, label: "Date (sets the order; newest shows first)", type: date }
      - name: tags
        label: Tags (filter buttons)
        description: "Type a tag, for example Water. Add, rename or delete tags freely; the filter buttons on the Maps page update to match. Use the exact same spelling on maps that share a tag."
        type: string
        list: true
      - { name: description, label: Description, type: text }
      - { name: image, label: Map image, type: image }
      - { name: image_alt, label: Image description (for screen readers), type: string }

  - name: research
    label: Research
    description: Papers, manuscripts and field work. Your name (Islam, M.S.) is made bold automatically.
    type: file
    path: content/research.json
    format: json
    list: true
    fields:
      - { name: year, label: Year, type: string }
      - { name: date, label: "Date (optional; sets the order, newest first)", type: date }
      - name: type
        label: Type
        type: select
        options:
          values:
            - { value: journal, label: Journal manuscript }
            - { value: conference, label: Conference paper }
            - { value: field, label: Field work }
            - { value: thesis, label: Thesis }
            - { value: other, label: Other }
      - { name: status, label: "Status (for example: Under review, Accepted, Published, Presented)", type: string }
      - { name: title, label: Title, type: string, required: true }
      - { name: authors, label: Authors, type: string }
      - { name: venue, label: "Journal, conference or place", type: string }
      - { name: note, label: One-line summary (optional), type: text }
      - { name: link, label: Link to paper or DOI (optional), type: string }

  - name: gallery
    label: Gallery (photos)
    description: Photos from conferences, fieldwork and the lab.
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - { name: image, label: Photo, type: image, required: true }
      - { name: title, label: Title, type: string }
      - { name: caption, label: Caption, type: text }
      - { name: alt, label: Photo description (for screen readers), type: string }

  - name: profile
    label: Profile
    type: file
    path: content/profile.json
    format: json
    fields:
      - { name: name, label: Name, type: string }
      - { name: role, label: Role line, type: string }
      - name: bio
        label: Short bio
        description: 2 or 3 sentences in your own voice, shown under your name at the top of the Profile page. Short reads best (about 20 to 35 words).
        type: text
      - { name: photo, label: Photo, type: image }
      - { name: photo_alt, label: Photo description (for screen readers), type: string }
      - { name: photo_caption, label: "Photo caption (optional, small text under the photo)", type: string }
      - name: facts
        label: Facts
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - name: emails
        label: Emails
        type: object
        list: true
        fields:
          - { name: label, label: "Label (for example: Personal email)", type: string }
          - { name: address, label: Email address, type: string }
      - { name: orcid, label: "ORCID iD (just the number, for example 0009-0001-9474-9287)", type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: interests, label: Research interests, type: string, list: true }
      - name: experience
        label: Education and experience
        type: object
        list: true
        fields:
          - { name: when, label: When, type: string }
          - { name: title, label: Title, type: string }
          - { name: detail, label: Details, type: text }
      - name: skills
        label: Skills
        type: object
        list: true
        fields:
          - { name: group, label: Group, type: string }
          - { name: items, label: Skills (comma separated), type: string }
      - name: awards
        label: Awards
        type: object
        list: true
        fields:
          - { name: year, label: Year, type: string }
          - { name: text, label: Award, type: string }
      - { name: languages, label: Languages, type: string, list: true }

  - name: places
    label: Fun game landmarks
    description: Places for the Landmarks level of Pin the Place (the Easy, Medium and Hard levels use official divisions, districts and upazilas). Latitude and longitude in decimal degrees.
    type: file
    path: content/places.json
    format: json
    list: true
    fields:
      - { name: name, label: Place name, type: string, required: true }
      - { name: lat, label: Latitude, type: number }
      - { name: lng, label: Longitude, type: number }
      - { name: fact, label: Short fact, type: text }
